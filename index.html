    <script>
      // Defensive guard against browser extension injection collisions (e.g. Zerion, MetaMask, Coinbase wallet conflicts)
      (function() {
        try {
          const origDefineProperty = Object.defineProperty;
          Object.defineProperty = function(obj, prop, descriptor) {
            try {
              return origDefineProperty.call(Object, obj, prop, descriptor);
            } catch (err) {
              if (
                err instanceof TypeError && 
                (String(prop).toLowerCase().includes('zerion') || String(err.message).toLowerCase().includes('cannot redefine property'))
              ) {
                // Extension property conflict, safely fallback
                try {
                  obj[prop] = descriptor && 'value' in descriptor ? descriptor.value : undefined;
                } catch (e) {}
                return obj;
              }
              throw err;
            }
          };
        } catch (e) {}

        window.addEventListener('error', function(event) {
          if (
            event && event.message && (
              event.message.toLowerCase().includes('zerion') ||
              event.message.toLowerCase().includes('cannot redefine property') ||
              event.message.includes('chrome-extension://') ||
              event.message.includes('moz-extension://')
            )
          ) {
            event.preventDefault();
            event.stopImmediatePropagation();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(event) {
          if (
            event && event.reason && (
              String(event.reason).toLowerCase().includes('zerion') ||
              String(event.reason).toLowerCase().includes('cannot redefine property') ||
              String(event.reason).includes('chrome-extension://')
            )
          ) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        }, true);
      })();
    </script>
