<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360"><title>Change In State of Delivery (C.I.S.D) Masterclass — schematic study</title><desc>Illustrative reference geometry, not a historical chart or trading signal.</desc><style>text{font-family:system-ui,sans-serif;fill:#344c52}.label{font-size:18px}.small{font-size:15px}.price,.bear-line,.quiet,.arrow{fill:none;stroke:#315f7c;stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round}.bear-line{stroke:#a75543}.quiet{stroke:#587679;stroke-width:2.6}.arrow{stroke-width:2}.guide,.connector,.reference,.bracket{fill:none;stroke:#60777a;stroke-width:1.5}.guide{stroke-dasharray:4 6}.connector{stroke-dasharray:3 5}.reference{stroke:#436c77;stroke-dasharray:5 4}.bracket{stroke:#315f7c;stroke-width:2}.zone,.pool{fill:#315f7c15;stroke:#486f7d;stroke-width:1.5}.zone2{fill:#a755431a;stroke:#975c48;stroke-width:1.5}.overlap{fill:#537c6e40;stroke:#426b62;stroke-width:1.5}.panel,.week,.node,.lens{fill:#ffffff70;stroke:#879d9d;stroke-width:1.3}.week{fill:#ffffff30;stroke:#8fa4a04d}.node{fill:#e6ede8}.lens{fill:#eef1eb}.subtle{fill:#315f7c0d}.bull{fill:#3b8067;color:#3b8067}.bear{fill:#b55c48;color:#b55c48}.wick{fill:none;stroke:currentColor;stroke-width:2}.dot{fill:#315f7c}.ring{fill:#f7f8f2;stroke:#315f7c;stroke-width:2.5}.clock{fill:#ffffff50;stroke:#879d9d;stroke-width:1.5}.clock-tick{fill:none;stroke:#60777a;stroke-width:2}.clock-window{fill:none;stroke:#975c48;stroke-width:13}.highlight{fill:none;stroke:#975c48;stroke-width:8;stroke-linecap:round}.diamond{fill:#e6ede8;stroke:#486f7d;stroke-width:1.5}</style><defs><marker id="tip" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0 0L6 3 0 6" fill="none" stroke="#315f7c" stroke-width="1.5"/></marker></defs><text x="43" y="46" class="label" text-anchor="start">Opening reference</text><path d="M48 103L589 103" class="reference"/><text x="543" y="88" class="small" text-anchor="middle">Close above</text><g class="bear"><path d="M100 88L100 166" class="wick"/><rect x="82.5" y="103" width="35" height="48" rx="1"/></g><g class="bear"><path d="M190 138L190 207" class="wick"/><rect x="172.5" y="151" width="35" height="39" rx="1"/></g><g class="bear"><path d="M280 176L280 251" class="wick"/><rect x="262.5" y="190" width="35" height="44" rx="1"/></g><g class="bull"><path d="M370 202L370 254" class="wick"/><rect x="352.5" y="211" width="35" height="19" rx="1"/></g><g class="bull"><path d="M502 59L502 232" class="wick"/><rect x="479.5" y="76" width="45" height="138" rx="1"/></g><circle cx="502" cy="76" r="8" class="ring"/><path d="M585 221V123" class="arrow" marker-end="url(#tip)"/><text x="55" y="311" class="label" text-anchor="start">Opposing run</text><text x="383" y="311" class="label" text-anchor="start">Delivery changes at a close</text></svg>