<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360"><title>The Opening Range Gap (ORG) &amp; Octant Grid — schematic study</title><desc>Illustrative reference geometry, not a historical chart or trading signal.</desc><style>text{font-family:system-ui,sans-serif;fill:#344c52}.label{font-size:18px}.small{font-size:15px}.price,.bear-line,.quiet,.arrow{fill:none;stroke:#315f7c;stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round}.bear-line{stroke:#a75543}.quiet{stroke:#587679;stroke-width:2.6}.arrow{stroke-width:2}.guide,.connector,.reference,.bracket{fill:none;stroke:#60777a;stroke-width:1.5}.guide{stroke-dasharray:4 6}.connector{stroke-dasharray:3 5}.reference{stroke:#436c77;stroke-dasharray:5 4}.bracket{stroke:#315f7c;stroke-width:2}.zone,.pool{fill:#315f7c15;stroke:#486f7d;stroke-width:1.5}.zone2{fill:#a755431a;stroke:#975c48;stroke-width:1.5}.overlap{fill:#537c6e40;stroke:#426b62;stroke-width:1.5}.panel,.week,.node,.lens{fill:#ffffff70;stroke:#879d9d;stroke-width:1.3}.week{fill:#ffffff30;stroke:#8fa4a04d}.node{fill:#e6ede8}.lens{fill:#eef1eb}.subtle{fill:#315f7c0d}.bull{fill:#3b8067;color:#3b8067}.bear{fill:#b55c48;color:#b55c48}.wick{fill:none;stroke:currentColor;stroke-width:2}.dot{fill:#315f7c}.ring{fill:#f7f8f2;stroke:#315f7c;stroke-width:2.5}.clock{fill:#ffffff50;stroke:#879d9d;stroke-width:1.5}.clock-tick{fill:none;stroke:#60777a;stroke-width:2}.clock-window{fill:none;stroke:#975c48;stroke-width:13}.highlight{fill:none;stroke:#975c48;stroke-width:8;stroke-linecap:round}.diamond{fill:#e6ede8;stroke:#486f7d;stroke-width:1.5}</style><defs><marker id="tip" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0 0L6 3 0 6" fill="none" stroke="#315f7c" stroke-width="1.5"/></marker></defs><rect x="88" y="54" width="459" height="240" rx="3" class="panel"/><path d="M88 54L547 54" class="reference"/><text x="566" y="60" class="small" text-anchor="start">0/8</text><path d="M88 84L547 84" class="guide"/><text x="566" y="90" class="small" text-anchor="start">1/8</text><path d="M88 114L547 114" class="guide"/><text x="566" y="120" class="small" text-anchor="start">2/8</text><path d="M88 144L547 144" class="guide"/><text x="566" y="150" class="small" text-anchor="start">3/8</text><path d="M88 174L547 174" class="guide"/><text x="566" y="180" class="small" text-anchor="start">4/8</text><path d="M88 204L547 204" class="guide"/><text x="566" y="210" class="small" text-anchor="start">5/8</text><path d="M88 234L547 234" class="guide"/><text x="566" y="240" class="small" text-anchor="start">6/8</text><path d="M88 264L547 264" class="guide"/><text x="566" y="270" class="small" text-anchor="start">7/8</text><path d="M88 294L547 294" class="reference"/><text x="566" y="300" class="small" text-anchor="start">8/8</text><text x="95" y="35" class="label" text-anchor="start">Selected close / open anchors</text><path d="M65 54H52V294H65" class="bracket"/><text x="320" y="331" class="label" text-anchor="middle">Eight equal parts</text><rect x="89" y="144" width="458" height="30" rx="0" class="subtle"/></svg>