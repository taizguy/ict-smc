<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360"><title>The 5 Algorithmic Opening Ranges — schematic study</title><desc>Illustrative reference geometry, not a historical chart or trading signal.</desc><style>text{font-family:system-ui,sans-serif;fill:#344c52}.label{font-size:18px}.small{font-size:15px}.price,.bear-line,.quiet,.arrow{fill:none;stroke:#315f7c;stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round}.bear-line{stroke:#a75543}.quiet{stroke:#587679;stroke-width:2.6}.arrow{stroke-width:2}.guide,.connector,.reference,.bracket{fill:none;stroke:#60777a;stroke-width:1.5}.guide{stroke-dasharray:4 6}.connector{stroke-dasharray:3 5}.reference{stroke:#436c77;stroke-dasharray:5 4}.bracket{stroke:#315f7c;stroke-width:2}.zone,.pool{fill:#315f7c15;stroke:#486f7d;stroke-width:1.5}.zone2{fill:#a755431a;stroke:#975c48;stroke-width:1.5}.overlap{fill:#537c6e40;stroke:#426b62;stroke-width:1.5}.panel,.week,.node,.lens{fill:#ffffff70;stroke:#879d9d;stroke-width:1.3}.week{fill:#ffffff30;stroke:#8fa4a04d}.node{fill:#e6ede8}.lens{fill:#eef1eb}.subtle{fill:#315f7c0d}.bull{fill:#3b8067;color:#3b8067}.bear{fill:#b55c48;color:#b55c48}.wick{fill:none;stroke:currentColor;stroke-width:2}.dot{fill:#315f7c}.ring{fill:#f7f8f2;stroke:#315f7c;stroke-width:2.5}.clock{fill:#ffffff50;stroke:#879d9d;stroke-width:1.5}.clock-tick{fill:none;stroke:#60777a;stroke-width:2}.clock-window{fill:none;stroke:#975c48;stroke-width:13}.highlight{fill:none;stroke:#975c48;stroke-width:8;stroke-linecap:round}.diamond{fill:#e6ede8;stroke:#486f7d;stroke-width:1.5}</style><defs><marker id="tip" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0 0L6 3 0 6" fill="none" stroke="#315f7c" stroke-width="1.5"/></marker></defs><text x="38" y="65" class="label" text-anchor="start">Midnight</text><rect x="188" y="43" width="108" height="25" rx="3" class="zone"/><path d="M181 77L588 77" class="guide"/><text x="38" y="121" class="label" text-anchor="start">London</text><rect x="247" y="99" width="108" height="25" rx="3" class="zone2"/><path d="M181 133L588 133" class="guide"/><text x="38" y="177" class="label" text-anchor="start">NY Killzone</text><rect x="306" y="155" width="108" height="25" rx="3" class="zone"/><path d="M181 189L588 189" class="guide"/><text x="38" y="233" class="label" text-anchor="start">AM session</text><rect x="365" y="211" width="108" height="25" rx="3" class="zone2"/><path d="M181 245L588 245" class="guide"/><text x="38" y="289" class="label" text-anchor="start">PM session</text><rect x="424" y="267" width="108" height="25" rx="3" class="zone"/><path d="M181 301L588 301" class="guide"/><text x="515" y="336" class="small" text-anchor="end">Session references</text></svg>