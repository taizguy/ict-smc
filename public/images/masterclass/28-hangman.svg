<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360"><title>The ICT Hangman PD Array Masterclass — schematic study</title><desc>Illustrative reference geometry, not a historical chart or trading signal.</desc><style>text{font-family:system-ui,sans-serif;fill:#344c52}.label{font-size:18px}.small{font-size:15px}.price,.bear-line,.quiet,.arrow{fill:none;stroke:#315f7c;stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round}.bear-line{stroke:#a75543}.quiet{stroke:#587679;stroke-width:2.6}.arrow{stroke-width:2}.guide,.connector,.reference,.bracket{fill:none;stroke:#60777a;stroke-width:1.5}.guide{stroke-dasharray:4 6}.connector{stroke-dasharray:3 5}.reference{stroke:#436c77;stroke-dasharray:5 4}.bracket{stroke:#315f7c;stroke-width:2}.zone,.pool{fill:#315f7c15;stroke:#486f7d;stroke-width:1.5}.zone2{fill:#a755431a;stroke:#975c48;stroke-width:1.5}.overlap{fill:#537c6e40;stroke:#426b62;stroke-width:1.5}.panel,.week,.node,.lens{fill:#ffffff70;stroke:#879d9d;stroke-width:1.3}.week{fill:#ffffff30;stroke:#8fa4a04d}.node{fill:#e6ede8}.lens{fill:#eef1eb}.subtle{fill:#315f7c0d}.bull{fill:#3b8067;color:#3b8067}.bear{fill:#b55c48;color:#b55c48}.wick{fill:none;stroke:currentColor;stroke-width:2}.dot{fill:#315f7c}.ring{fill:#f7f8f2;stroke:#315f7c;stroke-width:2.5}.clock{fill:#ffffff50;stroke:#879d9d;stroke-width:1.5}.clock-tick{fill:none;stroke:#60777a;stroke-width:2}.clock-window{fill:none;stroke:#975c48;stroke-width:13}.highlight{fill:none;stroke:#975c48;stroke-width:8;stroke-linecap:round}.diamond{fill:#e6ede8;stroke:#486f7d;stroke-width:1.5}</style><defs><marker id="tip" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0 0L6 3 0 6" fill="none" stroke="#315f7c" stroke-width="1.5"/></marker></defs><rect x="43" y="64" width="218" height="219" rx="5" class="panel"/><g class="bear"><path d="M152 87L152 253" class="wick"/><rect x="124.5" y="211" width="55" height="24" rx="1"/></g><path d="M152 87L152 211" class="highlight"/><path d="M128 149L233 149" class="reference"/><path d="M260 149L349 149" class="connector"/><circle cx="401" cy="149" r="65" class="lens"/><path d="M357 149L445 149" class="reference"/><path d="M401 100L401 199" class="highlight"/><text x="401" y="240" class="small" text-anchor="middle">Wick midpoint</text><rect x="512" y="106" width="77" height="139" rx="4" class="panel"/><g class="bull"><path d="M550 134L550 224" class="wick"/><rect x="539.5" y="153" width="21" height="50" rx="1"/></g><text x="548" y="282" class="small" text-anchor="middle">Response</text></svg>